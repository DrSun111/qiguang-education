<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f8fc"><title>学生进度</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:#27314c;font:14px "Microsoft YaHei","Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}button:hover{filter:brightness(.97)}.wrap{display:flex;min-height:100vh}.side{background:#fff;width:208px;padding:32px 16px;border-right:1px solid #e9edf5;flex-shrink:0}.logo{width:38px;height:38px;border-radius:13px;background:#596dea;color:white;display:grid;place-items:center;font-size:22px;margin:0 12px 36px}.nav{width:100%;text-align:left;background:transparent;border-radius:11px;padding:13px 15px;margin-bottom:5px;color:#818ba2}.nav.on{background:#eef0ff;color:#5365df;font-weight:700}.main{width:100%;max-width:1400px;padding:38px clamp(18px,4vw,58px);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:28px;flex-wrap:wrap}h1{font-size:26px;letter-spacing:-.7px;margin:0}h2{font-size:16px;margin:0}.sub{color:#9aa4b5;font-size:12px;margin-top:7px}.btn{background:#596de9;color:#fff;border-radius:10px;padding:11px 17px}.btn.light{background:#f0f2ff;color:#5c69cd}.btn.plain{background:#f5f6fa;color:#6b738b}.btn.red{background:#fff0f0;color:#d35465}.btn.sm{padding:7px 11px;font-size:12px}.flex{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px}.card,.panel{background:#fff;border:1px solid #edf0f5;border-radius:17px}.card{padding:22px}.num{font-size:32px;font-weight:750;margin-top:19px}.muted{color:#96a0b2;font-size:12px}.panel{padding:23px;margin-bottom:17px}.head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:19px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.project{padding:20px;border:1px solid #ebedf4;border-radius:14px}.project strong{font-size:15px}.avatar{width:34px;height:34px;background:#edf0ff;color:#5d6bda;border-radius:11px;display:grid;place-items:center;font-weight:700}.tag{font-size:11px;border-radius:7px;padding:5px 9px;background:#eef1ff;color:#6170cc}.tag.warn{background:#fff2e5;color:#b67e36}.tag.late{background:#ffeded;color:#d45867}.bar{background:#edf0f7;border-radius:8px;height:7px;overflow:hidden}.fill{height:100%;background:#6276ed;border-radius:8px}.project .flex{margin:13px 0}.row{display:flex;align-items:center;gap:12px;border-bottom:1px solid #f1f3f8;padding:13px 0}.row:last-child{border:0}.grow{flex:1;min-width:0}.row small{color:#a1aabd}.empty{text-align:center;padding:36px;color:#a1a9b7}.form{display:grid;gap:13px}.form label{color:#7c879a;font-size:12px;display:grid;gap:7px}.form input,.form select{border:1px solid #e4e9f1;border-radius:9px;padding:11px;width:100%;background:white;color:#2b3449;min-width:0}.overlay{position:fixed;inset:0;background:#12193199;display:grid;place-items:center;padding:18px;z-index:10}.modal{width:min(510px,100%);max-height:90vh;overflow:auto;background:white;border-radius:18px;padding:25px;box-shadow:0 22px 70px #151a3540}.modal h2{margin-bottom:22px}.modal .actions{justify-content:flex-end;margin-top:23px}.two{display:grid;grid-template-columns:1fr 1fr;gap:13px}.setting{display:grid;grid-template-columns:1fr 1fr;gap:17px}.danger{color:#d65f6a}.filter{border:1px solid #e8ebf3;background:#fff;padding:10px;border-radius:9px;max-width:230px}.notice{background:#fff9ea;border:1px solid #f8e7bf;border-radius:12px;padding:13px 16px;color:#9b7637;font-size:12px;margin-bottom:18px}@media(max-width:900px){.side{width:160px}.stats{grid-template-columns:repeat(2,1fr)}.grid,.setting{grid-template-columns:1fr}}@media(max-width:620px){.wrap{display:block}.side{width:100%;display:flex;overflow:auto;padding:9px}.logo{display:none}.nav{white-space:nowrap;margin:0}.main{padding:20px 13px}.card{padding:15px}.panel{padding:15px}.two{grid-template-columns:1fr}}
</style></head><body><div id="app"></div><script>
const KEY='student-project-tracker-v2',defaults=[['课题','选题','方案','实验','分析','论文','完成'],['赛事','准备','报名','材料','评审','答辩','完成']];
const fresh=()=>({students:[],items:[],milestones:[],stages:defaults.flatMap(a=>a.slice(1).map((name,i)=>({id:crypto.randomUUID(),kind:a[0],name,position:i})))});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{db=fresh()}let page='总览',filter='全部',query='',editor='';
const el=document.getElementById('app'),id=()=>crypto.randomUUID(),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const day=d=>Math.round((new Date(d+'T12:00:00')-new Date(new Date().toLocaleDateString('en-CA')+'T12:00:00'))/864e5);
const by=(type,k)=>db[type].find(x=>x.id===k),miles=it=>db.milestones.filter(x=>x.item_id===it.id),progress=it=>{let a=miles(it);return a.length?Math.round(a.filter(m=>m.done).length/a.length*100):0},upcoming=()=>db.milestones.filter(m=>!m.done&&m.due&&day(m.due)<=7).sort((a,b)=>a.due.localeCompare(b.due));
function save(){localStorage.setItem(KEY,JSON.stringify(db));render();notify(false)}
function nav(n){page=n;render()}function title(t,sub,actions=''){return '<div class="top"><div><h1>'+t+'</h1><div class="sub">'+sub+'</div></div><div class="flex">'+actions+'</div></div>'}
function buttons(){return '<button class="btn light" onclick="edit(\'student\')">+ 学生</button><button class="btn" onclick="edit(\'item\')">+ 项目</button>'}
function pcard(it){let ms=miles(it).filter(m=>!m.done&&m.due).sort((a,b)=>a.due.localeCompare(b.due)),next=ms[0],d=next?day(next.due):999,p=progress(it),who=by('students',it.student_id);return '<div class="project"><div class="flex"><div class="avatar">'+esc(who?.name?.[0]||'?')+'</div><div class="grow"><strong>'+esc(who?.name||'')+'</strong><div class="muted">'+esc(it.kind)+' · '+esc(by('stages',it.stage_id)?.name||'未设置')+'</div></div><button class="btn plain sm" onclick="edit(\'item\',\''+it.id+'\')">编辑</button></div><strong>'+esc(it.title)+'</strong><div class="flex" style="justify-content:space-between"><span class="tag '+(d<0?'late':d<=7?'warn':'')+'">'+(d<0?'已逾期':d<=7?'临近截止':'进行中')+'</span><span class="muted">'+esc(next?.due||'暂无截止日期')+'</span></div><div class="flex" style="justify-content:space-between"><small class="muted">完成进度</small><strong>'+p+'%</strong></div><div class="bar"><div class="fill" style="width:'+p+'%"></div></div><div class="flex"><button class="btn light sm" onclick="detail(\''+it.id+'\')">进度节点</button></div></div>'}
function reminders(){let a=upcoming();return a.length?a.map(m=>{let it=by('items',m.item_id),who=by('students',it?.student_id),d=day(m.due);return '<div class="row"><span class="tag '+(d<0?'late':'warn')+'">'+esc(m.due.slice(5))+'</span><div class="grow"><strong>'+esc(who?.name)+' · '+esc(m.title)+'</strong><div class="muted">'+esc(it?.title||'')+'</div></div><span class="muted">'+(d<0?'逾期 '+-d+' 天':d===0?'今天截止':'还剩 '+d+' 天')+'</span><button class="btn plain sm" onclick="detail(\''+m.item_id+'\')">查看</button></div>'}).join(''):'<div class="empty">暂无待提醒事项</div>'}
function main(){if(page==='总览')return title('工作总览','课题与赛事进度',buttons())+'<div class="stats">'+[['学生人数',db.students.length],['进行中项目',db.items.filter(x=>progress(x)<100).length],['7天内截止',upcoming().filter(x=>day(x.due)>=0).length],['已完成节点',db.milestones.filter(x=>x.done).length]].map(([n,v])=>'<div class="card"><div class="muted">'+n+'</div><div class="num">'+v+'</div></div>').join('')+'</div><section class="panel"><div class="head"><h2>项目进度</h2><button class="btn plain sm" onclick="nav(\'学生与项目\')">全部项目</button></div><div class="grid">'+(db.items.length?db.items.slice(0,6).map(pcard).join(''):'<div class="empty">添加学生和项目后显示进度</div>')+'</div></section><section class="panel"><div class="head"><h2>近期截止</h2></div>'+reminders()+'</section>';
if(page==='学生与项目'){let list=db.items.filter(x=>(filter==='全部'||x.kind===filter)&&((x.title+' '+(by('students',x.student_id)?.name||'')).includes(query)));return title('学生与项目',db.students.length+' 位学生 · '+db.items.length+' 个项目',buttons())+'<section class="panel"><div class="head"><div class="flex">'+['全部','课题','赛事'].map(x=>'<button class="btn '+(filter===x?'':'plain')+' sm" onclick="filter=\''+x+'\';render()">'+x+'</button>').join('')+'</div><input class="filter" placeholder="搜索学生或项目" value="'+esc(query)+'" oninput="query=this.value;document.getElementById(\'project-list\').innerHTML=projectList()"></div><div class="grid" id="project-list">'+projectList()+'</div></section><section class="panel"><div class="head"><h2>学生名单</h2><button class="btn light sm" onclick="edit(\'student\')">+ 添加</button></div>'+ (db.students.length?db.students.map(s=>'<div class="row"><div class="avatar">'+esc(s.name[0])+'</div><strong class="grow">'+esc(s.name)+'</strong><span class="muted">'+db.items.filter(i=>i.student_id===s.id).length+' 项</span><button class="btn plain sm" onclick="edit(\'student\',\''+s.id+'\')">编辑</button><button class="btn red sm" onclick="remove(\'student\',\''+s.id+'\')">删除</button></div>').join(''):'<div class="empty">暂无学生</div>')+'</section>'}
if(page==='截止提醒')return title('截止提醒','提前 7 天 · 自动筛选','<button class="btn light" onclick="askNotify()">开启浏览器提醒</button>')+'<section class="panel">'+reminders()+'</section>';
return title('阶段设置','自定义进度阶段')+'<div class="setting">'+['课题','赛事'].map(k=>'<section class="panel"><div class="head"><h2>'+k+'阶段</h2><button class="btn light sm" onclick="edit(\'stage\',null,\''+k+'\')">+ 添加</button></div>'+db.stages.filter(s=>s.kind===k).sort((a,b)=>a.position-b.position).map(s=>'<div class="row"><span class="grow">'+esc(s.name)+'</span><button class="btn plain sm" onclick="edit(\'stage\',\''+s.id+'\')">编辑</button><button class="btn red sm" onclick="remove(\'stage\',\''+s.id+'\')">删除</button></div>').join('')+'</section>').join('')+'</div>'}
function projectList(){let a=db.items.filter(x=>(filter==='全部'||x.kind===filter)&&((x.title+' '+(by('students',x.student_id)?.name||'')).includes(query)));return a.length?a.map(pcard).join(''):'<div class="empty">暂无项目</div>'}
function render(){el.innerHTML='<div class="wrap"><aside class="side"><div class="logo">✓</div>'+['总览','学生与项目','截止提醒','阶段设置'].map(n=>'<button class="nav '+(page===n?'on':'')+'" onclick="nav(\''+n+'\')">'+n+'</button>').join('')+'</aside><main class="main">'+main()+'</main></div>'+editor}
function modal(name,html,actions){editor='<div class="overlay" onclick="if(event.target===this)closeEdit()"><div class="modal"><h2>'+name+'</h2>'+html+'<div class="flex actions"><button class="btn plain" onclick="closeEdit()">取消</button>'+actions+'</div></div></div>';render()}
function closeEdit(){editor='';render()}
function edit(type,key=null,kind='课题'){let obj=key?by(type==='student'?'students':type==='item'?'items':'stages',key):null;const inp=(label,name,value='',extra='')=>'<label>'+label+'<input name="'+name+'" value="'+esc(value)+'" '+extra+' required></label>';let fields='';
if(type==='student')fields=inp('学生姓名','name',obj?.name,'maxlength="100"');
if(type==='stage')fields=inp('阶段名称','name',obj?.name,'maxlength="100"');
if(type==='item'){if(!db.students.length){alert('请先添加学生');edit('student');return}kind=obj?.kind||kind;fields='<div class="two"><label>学生<select name="student_id">'+db.students.map(s=>'<option value="'+s.id+'" '+(s.id===obj?.student_id?'selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select></label><label>类型<select name="kind" onchange="stageOptions(this.value)">'+['课题','赛事'].map(k=>'<option '+(kind===k?'selected':'')+'>'+k+'</option>').join('')+'</select></label></div>'+inp('项目名称','title',obj?.title,'maxlength="100"')+'<label>当前阶段<select name="stage_id" id="stage-options"></select></label>'}
modal(obj?'编辑':'新增','<form class="form" id="form" onsubmit="event.preventDefault();submitForm(\''+type+'\',\''+(key||'')+'\',\''+kind+'\')">'+fields+'</form>','<button class="btn" onclick="document.getElementById(\'form\').requestSubmit()">保存</button>');if(type==='item')stageOptions(kind,obj?.stage_id)}
function stageOptions(kind,selected){let sel=document.getElementById('stage-options');if(sel)sel.innerHTML=db.stages.filter(s=>s.kind===kind).sort((a,b)=>a.position-b.position).map(s=>'<option value="'+s.id+'" '+(s.id===selected?'selected':'')+'>'+esc(s.name)+'</option>').join('')}
function submitForm(type,key,kind){let f=document.getElementById('form');if(!f.reportValidity())return;const v=n=>f.elements[n]?.value||'',coll=type==='student'?'students':type==='stage'?'stages':'items',obj=key?by(coll,key):{id:id()};if(type==='student')obj.name=v('name').trim();if(type==='stage'){obj.name=v('name').trim();obj.kind=kind;obj.position=db.stages.filter(s=>s.kind===kind).length}if(type==='item'){obj.student_id=v('student_id');obj.kind=v('kind');obj.title=v('title').trim();obj.stage_id=v('stage_id')}if(!key)db[coll].push(obj);editor='';save()}
function detail(itemId){let it=by('items',itemId);if(!it)return;let a=miles(it),rows=a.length?a.map(m=>'<div class="row"><input type="checkbox" '+(m.done?'checked':'')+' onchange="done(\''+m.id+'\',this.checked)"><div class="grow"><span style="'+(m.done?'text-decoration:line-through;color:#a7adbc':'')+'">'+esc(m.title)+'</span><div class="muted">'+esc(m.due||'无截止日期')+'</div></div><button class="btn plain sm" onclick="editM(\''+itemId+'\',\''+m.id+'\')">编辑</button><button class="btn red sm" onclick="remove(\'milestone\',\''+m.id+'\',\''+itemId+'\')">删除</button></div>').join(''):'<div class="empty">暂无进度节点</div>';modal('进度节点 · '+esc(it.title),'<div>'+rows+'</div><div style="margin-top:16px"><button class="btn light sm" onclick="editM(\''+itemId+'\')">+ 新增节点</button></div>','<button class="btn" onclick="closeEdit()">完成</button>')}
function done(key,val){let m=by('milestones',key);m.done=val;save();detail(m.item_id)}
function editM(itemId,key=null){let m=key?by('milestones',key):null;modal(m?'编辑节点':'新增节点','<form id="form" class="form" onsubmit="event.preventDefault();submitM(\''+itemId+'\',\''+(key||'')+'\')"><label>节点名称<input name="title" required value="'+esc(m?.title)+'"></label><label>截止日期<input name="due" type="date" value="'+esc(m?.due)+'"></label></form>','<button class="btn" onclick="document.getElementById(\'form\').requestSubmit()">保存</button>')}
function submitM(itemId,key){let f=document.getElementById('form');if(!f.reportValidity())return;let m=key?by('milestones',key):{id:id(),item_id:itemId,done:false};m.title=f.elements.title.value.trim();m.due=f.elements.due.value;if(!key)db.milestones.push(m);save();detail(itemId)}
function remove(type,key,itemId){if(!confirm('确定删除？'))return;let coll=type==='student'?'students':type==='item'?'items':type==='stage'?'stages':'milestones';db[coll]=db[coll].filter(x=>x.id!==key);if(type==='student'){let gone=db.items.filter(x=>x.student_id===key).map(x=>x.id);db.items=db.items.filter(x=>x.student_id!==key);db.milestones=db.milestones.filter(x=>!gone.includes(x.item_id))}if(type==='item')db.milestones=db.milestones.filter(x=>x.item_id!==key);if(type==='stage')db.items.forEach(x=>{if(x.stage_id===key)x.stage_id='' });save();if(itemId)detail(itemId)}
async function askNotify(){if(!('Notification'in window)){alert('当前浏览器不支持通知');return}let p=await Notification.requestPermission();if(p==='granted'){notify(true);alert('已开启，打开网页时可收到提醒')}else alert('请在浏览器设置中允许此网站通知')}
function notify(force){if(!('Notification'in window)||Notification.permission!=='granted')return;let a=upcoming();if(!a.length)return;let mark=new Date().toDateString(),last=localStorage.getItem(KEY+'-last');if(!force&&last===mark)return;let m=a[0],it=by('items',m.item_id),s=by('students',it?.student_id);new Notification('近期截止 · '+(s?.name||''),{body:m.title+' · '+m.due+(a.length>1?'（另有 '+(a.length-1)+' 项）':'')});localStorage.setItem(KEY+'-last',mark)}
render();notify(false);setInterval(()=>{render();notify(false)},300000);
</script></body></html>
