<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8fc"><title>进度管理</title><style>
:root{--bg:#f6f8fc;--white:#fff;--text:#28334b;--sub:#8c98af;--line:#e8ecf4;--primary:#546be7;--light:#eef1ff;--warning:#c18236;--red:#d95c68}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.5 "Microsoft YaHei","Segoe UI",sans-serif;color:var(--text)}button,input,select{font:inherit}button{cursor:pointer;border:0}button:hover{filter:brightness(.97)}.app{display:flex;min-height:100vh}.sidebar{width:194px;flex:none;background:white;border-right:1px solid var(--line);padding:28px 14px}.mark{width:40px;height:40px;display:grid;place-items:center;color:white;background:var(--primary);border-radius:13px;font-size:23px;margin:0 10px 34px}.nav{width:100%;padding:12px 16px;background:none;color:#8792a6;text-align:left;border-radius:11px;margin-bottom:5px}.nav.active{background:#eef1ff;color:#4f64d9;font-weight:700}.content{padding:36px clamp(15px,3.2vw,52px);flex:1;min-width:0;max-width:1700px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:26px}h1{font-size:24px;margin:0;font-weight:750;letter-spacing:-.5px}h2{font-size:17px;margin:0}small,.sub{color:var(--sub);font-size:12px}.sub{margin-top:5px}.btn{border-radius:10px;padding:10px 15px;color:white;background:var(--primary);white-space:nowrap}.btn.soft{background:var(--light);color:#5669d5}.btn.ghost{background:#f5f6fa;color:#77829a}.btn.danger{background:#fff0f1;color:var(--red)}.btn.tiny{font-size:12px;padding:6px 11px}.flex{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.panel{background:white;border:1px solid #ecf0f6;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 3px 18px #35406305}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}.pills{display:flex;align-items:center;gap:8px}.pill{padding:7px 12px;border-radius:9px;background:#f5f6fa;color:#7f8aa0;font-size:12px}.pill.on{background:#eef1ff;color:#5068d8;font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:20px}.stat{background:white;border:1px solid #ebeff5;border-radius:15px;padding:20px}.stat strong{display:block;font-size:30px;margin-top:10px}.tabwrap{overflow-x:auto;border:1px solid #e9edf4;border-radius:12px}table{border-collapse:separate;border-spacing:0;width:100%;min-width:620px;text-align:center}th,td{padding:12px 14px;border-bottom:1px solid #edf0f5;border-right:1px solid #edf0f5;vertical-align:middle}th:last-child,td:last-child{border-right:none}tbody tr:last-child td{border-bottom:none}th{background:#f8faff;font-size:12px;font-weight:600;color:#6d7c98;min-width:128px}th:first-child,td:first-child{text-align:left;min-width:130px;position:sticky;left:0;z-index:1;background:white}th:first-child{background:#f8faff;z-index:2}td{font-size:13px}.thlabel{display:flex;gap:5px;justify-content:center;align-items:center}.date{font-size:11px;color:#98a2b8;margin-top:5px;font-weight:400}.date.warn{color:#b77b36}.date.late{color:#d75c65}.tick{appearance:none;width:22px;height:22px;border:1.5px solid #d8deeb;border-radius:7px;background:white;cursor:pointer;vertical-align:middle;position:relative}.tick:checked{background:#687aed;border-color:#687aed}.tick:checked:after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid white;border-width:0 2px 2px 0;transform:rotate(45deg)}.completed{color:#5b6de2;font-size:13px;font-weight:650}.progress{display:flex;align-items:center;gap:8px;justify-content:center}.track{width:67px;height:6px;background:#edf0f7;border-radius:8px;overflow:hidden}.fill{height:100%;background:#6578ee;border-radius:8px}.row{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid #f0f2f6}.row:last-child{border:0}.grow{flex:1;min-width:0}.avatar{width:34px;height:34px;border-radius:11px;background:#eef1ff;color:#5368d9;display:grid;place-items:center;font-weight:700}.empty{padding:35px;text-align:center;color:#a0aabc}.tag{background:#eff2ff;color:#586bdb;font-size:11px;padding:5px 8px;border-radius:7px}.tag.warn{background:#fff4e7;color:#ae773a}.tag.late{background:#fff0f0;color:#d65c69}.overlay{position:fixed;inset:0;z-index:5;background:#141e3580;display:grid;place-items:center;padding:15px}.modal{background:white;border-radius:18px;padding:25px;width:min(515px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 60px #1e253548}.modal h2{margin:0 0 20px}.form{display:grid;gap:14px}.form label{display:grid;gap:7px;color:#7c879b;font-size:12px}.form input,.form select{border:1px solid #e4e9f0;border-radius:9px;padding:11px;color:#27344c;min-width:0;width:100%;background:white}.form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.footer{margin-top:22px;display:flex;gap:8px;justify-content:flex-end}.info{font-size:12px;color:#9aa3b7}.notice{border:1px solid #f2e3bf;background:#fffaee;border-radius:10px;padding:12px 15px;color:#a17c3b;font-size:12px;margin-bottom:16px}.listtable{display:grid;gap:7px}.tablecard{display:flex;gap:10px;align-items:center;padding:13px 15px;border:1px solid #eef0f5;border-radius:12px}.tablecard:hover{background:#fafbff}@media(max-width:900px){.sidebar{width:150px}.stats{grid-template-columns:repeat(2,1fr)}.content{padding:22px 15px}}@media(max-width:620px){.app{display:block}.sidebar{display:flex;width:100%;padding:8px;overflow:auto}.mark{display:none}.nav{white-space:nowrap;margin:0;width:auto}.stats{grid-template-columns:repeat(2,1fr)}.panel{padding:15px}.form .two{grid-template-columns:1fr}}
</style></head><body><div id="app"></div><script>
const KEY='student-matrix-v1',OLD='student-project-tracker-v2';const uid=()=>crypto.randomUUID();const safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));const today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const diff=date=>Math.round((new Date(date+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000);const blank=()=>({students:[],tables:[]});
function migrate(){let o;try{o=JSON.parse(localStorage.getItem(OLD))}catch{}if(!o)return blank();const students=(o.students||[]).map(x=>({id:x.id,name:x.name}));let tables=[];for(let item of o.items||[]){let table=tables.find(t=>t.name===item.title&&t.kind===item.kind);if(!table){table={id:uid(),kind:item.kind,name:item.title,columns:[],cells:{}};tables.push(table)}const ms=(o.milestones||[]).filter(x=>x.item_id===item.id);for(let m of ms){let col=table.columns.find(c=>c.name===m.title&&c.due===(m.due||''));if(!col){col={id:uid(),name:m.title,due:m.due||''};table.columns.push(col)}if(!table.cells[item.student_id])table.cells[item.student_id]={};table.cells[item.student_id][col.id]=!!m.done}}return {students,tables}}
let db;try{db=JSON.parse(localStorage.getItem(KEY))||migrate()}catch{db=migrate()}if(!Array.isArray(db.students)||!Array.isArray(db.tables))db=blank();let page='总览',kindFilter='全部',modalHTML='',activeTable='';
function getTable(id){return db.tables.find(x=>x.id===id)}function getStudent(id){return db.students.find(x=>x.id===id)}function save(){localStorage.setItem(KEY,JSON.stringify(db));draw();notify()}
function btn(text,fn,style='soft tiny'){return '<button class="btn '+style+'" onclick="'+fn+'">'+text+'</button>'}
function header(t,sub,actions=''){return '<div class="top"><div><h1>'+t+'</h1><div class="sub">'+sub+'</div></div><div class="flex">'+actions+'</div></div>'}
function summary(){let n=db.tables.reduce((sum,t)=>sum+t.columns.length*db.students.length,0),done=db.tables.reduce((sum,t)=>sum+db.students.reduce((a,s)=>a+t.columns.filter(c=>t.cells?.[s.id]?.[c.id]).length,0),0);return '<div class="stats">'+[['学生',db.students.length],['赛事与课题',db.tables.length],['已完成',done],['待办节点',n-done]].map(([a,b])=>'<div class="stat"><small>'+a+'</small><strong>'+b+'</strong></div>').join('')+'</div>'}
function pending(){let arr=[];for(let t of db.tables)for(let col of t.columns)if(col.due&&diff(col.due)<=7){let students=db.students.filter(s=>!t.cells?.[s.id]?.[col.id]);if(students.length)arr.push({table:t,col,students,days:diff(col.due)})}return arr.sort((a,b)=>a.days-b.days)}
function alertRows(){let a=pending();return a.length?a.map(x=>'<div class="row"><span class="tag '+(x.days<0?'late':'warn')+'">'+safe(x.col.due.slice(5))+'</span><div class="grow"><strong>'+safe(x.table.name)+' · '+safe(x.col.name)+'</strong><div class="info">'+safe(x.students.map(s=>s.name).join('、'))+'</div></div><span class="info">'+(x.days<0?'逾期 '+-x.days+' 天':x.days===0?'今天截止':'剩 '+x.days+' 天')+'</span>'+btn('查看',"openTable('"+x.table.id+"')",'ghost tiny')+'</div>').join(''):'<div class="empty">暂无临近截止的材料</div>'}
function tableSummary(t){let all=t.columns.length*db.students.length,done=db.students.reduce((sum,s)=>sum+t.columns.filter(c=>t.cells?.[s.id]?.[c.id]).length,0);return all?Math.round(done/all*100):0}
function matrix(t){let cols=t.columns;return '<div class="tabwrap"><table><thead><tr><th>学生</th>'+cols.map(c=>{let d=c.due?diff(c.due):null;return '<th><div class="thlabel"><span>'+safe(c.name)+'</span><button class="btn ghost tiny" title="编辑表头与截止日期" onclick="editColumn(\''+t.id+'\',\''+c.id+'\')">✎</button></div><div class="date '+(d!==null&&d<0?'late':d!==null&&d<=7?'warn':'')+'">'+(c.due?safe(c.due):'未设置截止')+'</div></th>'}).join('')+'<th>进度</th></tr></thead><tbody>'+ (db.students.length?db.students.map(s=>{let count=cols.filter(c=>t.cells?.[s.id]?.[c.id]).length,p=cols.length?Math.round(count/cols.length*100):0;return '<tr><td><strong>'+safe(s.name)+'</strong></td>'+cols.map(c=>'<td><input class="tick" type="checkbox" aria-label="'+safe(s.name+' '+c.name)+'" '+(t.cells?.[s.id]?.[c.id]?'checked':'')+' onchange="setCell(\''+t.id+'\',\''+s.id+'\',\''+c.id+'\',this.checked)"></td>').join('')+'<td><div class="progress"><div class="track"><div class="fill" style="width:'+p+'%"></div></div><span>'+p+'%</span></div></td></tr>'}).join(''):'<tr><td colspan="'+(cols.length+2)+'" class="empty">添加学生后自动生成所有行</td></tr>')+'</tbody></table></div>'}
function tablePanel(t){return '<section class="panel"><div class="panelhead"><div><h2>'+safe(t.name)+'</h2><div class="sub">'+safe(t.kind)+' · '+db.students.length+' 人 · '+t.columns.length+' 项材料 · 已完成 '+tableSummary(t)+'%</div></div><div class="flex">'+btn('+ 材料 / 阶段',"editColumn('"+t.id+"')") +btn('编辑表格',"editTable('"+t.id+"')",'ghost tiny')+'</div></div>'+matrix(t)+'</section>'}
function tablesPage(){let ts=db.tables.filter(t=>kindFilter==='全部'||t.kind===kindFilter);return header('进度表格','一项赛事或课题，一张共享进度表',btn('+ 新建表格','editTable()',''))+'<div class="pills" style="margin-bottom:19px">'+['全部','赛事','课题'].map(k=>'<button class="pill '+(kindFilter===k?'on':'')+'" onclick="kindFilter=\''+k+'\';draw()">'+k+'</button>').join('')+'</div>'+(ts.length?ts.map(tablePanel).join(''):'<section class="panel"><div class="empty">新建赛事或课题后自动生成表格</div></section>')}
function roster(){return header('学生名单','编辑一次，自动同步到所有表格',btn('+ 添加学生','editStudent()',''))+'<section class="panel"><div class="panelhead"><h2>全部学生</h2><small>'+db.students.length+' 人</small></div>'+(db.students.length?db.students.map(s=>'<div class="row"><div class="avatar">'+safe(s.name.slice(0,1))+'</div><strong class="grow">'+safe(s.name)+'</strong>'+btn('编辑',"editStudent('"+s.id+"')",'ghost tiny')+btn('删除',"removeStudent('"+s.id+"')",'danger tiny')+'</div>').join(''):'<div class="empty">暂无学生</div>')+'</section>'}
function dashboard(){return header('工作总览','全部学生 · 全部进度',btn('+ 新建表格','editTable()','')+btn('+ 学生','editStudent()','soft'))+summary()+'<section class="panel"><div class="panelhead"><h2>全部表格</h2>'+btn('查看进度','navigate("进度表格")','ghost tiny')+'</div>'+(db.tables.length?'<div class="listtable">'+db.tables.map(t=>'<div class="tablecard"><span class="tag">'+safe(t.kind)+'</span><strong class="grow">'+safe(t.name)+'</strong><small>'+tableSummary(t)+'%</small>'+btn('打开',"openTable('"+t.id+"')",'soft tiny')+'</div>').join('')+'</div>':'<div class="empty">尚未创建表格</div>')+'</section><section class="panel"><div class="panelhead"><h2>近期截止</h2>'+btn('查看提醒','navigate("截止提醒")','ghost tiny')+'</div>'+alertRows()+'</section>'}
function draw(){document.getElementById('app').innerHTML='<div class="app"><aside class="sidebar"><div class="mark">✓</div>'+['总览','进度表格','学生名单','截止提醒'].map(x=>'<button class="nav '+(page===x?'active':'')+'" onclick="navigate(\''+x+'\')">'+x+'</button>').join('')+'</aside><main class="content">'+(page==='总览'?dashboard():page==='进度表格'?tablesPage():page==='学生名单'?roster():header('截止提醒','提前 7 天 · 未完成材料',btn('允许通知','enableNotification()','soft'))+'<section class="panel">'+alertRows()+'</section>')+'</main></div>'+modalHTML;if(activeTable){let anchor=document.getElementById('table-'+activeTable);if(anchor)anchor.scrollIntoView({block:'start'})}}
function navigate(p){page=p;activeTable='';draw()}function openTable(id){page='进度表格';kindFilter='全部';activeTable=id;draw();const t=document.querySelector('[data-table="'+id+'"]');if(t)t.scrollIntoView({behavior:'smooth'})}
function dialog(title,body,submit){modalHTML='<div class="overlay" onclick="if(event.target===this)closeDialog()"><div class="modal"><h2>'+title+'</h2><form id="editform" class="form" onsubmit="event.preventDefault();'+submit+'">'+body+'</form><div class="footer">'+btn('取消','closeDialog()','ghost')+'<button class="btn" onclick="document.getElementById(\'editform\').requestSubmit()">保存</button></div></div></div>';draw()}
function closeDialog(){modalHTML='';draw()}const field=(title,name,value='',type='text')=>'<label>'+title+'<input name="'+name+'" type="'+type+'" value="'+safe(value)+'" '+(type==='text'?'maxlength="100"':'')+' '+(type==='text'?'required':'')+'></label>';
function editStudent(id=''){let s=getStudent(id);dialog(id?'编辑学生':'添加学生',field('姓名','name',s?.name), "saveStudent('"+id+"')")}
function saveStudent(id){let f=document.getElementById('editform');if(!f.reportValidity())return;let name=f.elements.name.value.trim();if(!name)return;let s=getStudent(id);if(s)s.name=name;else db.students.push({id:uid(),name});modalHTML='';save()}
function removeStudent(id){if(!confirm('删除该学生及其所有勾选记录？'))return;db.students=db.students.filter(s=>s.id!==id);for(let t of db.tables)if(t.cells)delete t.cells[id];save()}
function editTable(id=''){let t=getTable(id);dialog(id?'编辑表格':'新建表格',field('赛事 / 课题名称','name',t?.name)+'<label>类型<select name="kind"><option '+(t?.kind==='赛事'?'selected':'')+'>赛事</option><option '+(t?.kind==='课题'?'selected':'')+'>课题</option></select></label>', "saveTable('"+id+"')");if(id){let modal=document.querySelector('.modal');modal.insertAdjacentHTML('beforeend','<div style="margin-top:15px;text-align:right">'+btn('删除整张表',"removeTable('"+id+"')",'danger tiny')+'</div>')}}
function saveTable(id){let f=document.getElementById('editform');if(!f.reportValidity())return;let name=f.elements.name.value.trim(),kind=f.elements.kind.value;if(!name)return;let t=getTable(id);if(t){t.name=name;t.kind=kind}else db.tables.push({id:uid(),name,kind,columns:[],cells:{}});modalHTML='';page='进度表格';save()}
function removeTable(id){if(!confirm('确定删除此表及全部完成记录？'))return;db.tables=db.tables.filter(t=>t.id!==id);modalHTML='';save()}
function editColumn(tableId,colId=''){let t=getTable(tableId),c=t.columns.find(x=>x.id===colId);dialog(c?'编辑表头':'新增材料 / 阶段',field('材料 / 阶段名称','name',c?.name)+field('统一截止日期','due',c?.due||'','date'),"saveColumn('"+tableId+"','"+colId+"')");if(c)document.querySelector('.modal').insertAdjacentHTML('beforeend','<div style="margin-top:15px;text-align:right">'+btn('删除此列',"removeColumn('"+tableId+"','"+colId+"')",'danger tiny')+'</div>')}
function saveColumn(tableId,colId){let f=document.getElementById('editform');if(!f.reportValidity())return;let name=f.elements.name.value.trim(),due=f.elements.due.value;if(!name)return;let t=getTable(tableId),c=t.columns.find(x=>x.id===colId);if(c){c.name=name;c.due=due}else t.columns.push({id:uid(),name,due});modalHTML='';save()}
function removeColumn(tableId,colId){if(!confirm('删除该材料及整列完成记录？'))return;let t=getTable(tableId);t.columns=t.columns.filter(c=>c.id!==colId);for(let v of Object.values(t.cells||{}))delete v[colId];modalHTML='';save()}
function setCell(tid,sid,cid,checked){let t=getTable(tid);if(!t.cells)t.cells={};if(!t.cells[sid])t.cells[sid]={};t.cells[sid][cid]=checked;save()}
async function enableNotification(){if(!('Notification'in window))return alert('浏览器不支持系统通知');let r=await Notification.requestPermission();if(r==='granted'){notify(true);alert('通知已开启')}else alert('请在浏览器中允许通知')}
function notify(force=false){if(!('Notification'in window)||Notification.permission!=='granted)return;let a=pending();if(!a.length)return;let date=today(),mark='student-matrix-notified';if(!force&&localStorage.getItem(mark)===date)return;let x=a[0];new Notification('截止提醒 · '+x.table.name,{body:x.col.name+' · '+x.col.due+' · '+x.students.length+' 人未完成'});localStorage.setItem(mark,date)}
draw();notify();setInterval(()=>{draw();notify()},300000);
</script></body></html>
